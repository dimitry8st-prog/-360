<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Кабинет — {{ app_name }}</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a href="/dashboard" class="logo">ДИС Аналитик 360</a><span>{{ user.email }}</span>{% if user.is_admin %}<a href="/admin">Админ</a>{% endif %}<form method="post" action="/logout"><button class="ghost">Выйти</button></form></header><main><section class="card"><h1>Новый анализ</h1><p id="ws-status" class="status">Подключение к каналу статуса…</p><form method="post" action="/analyze" enctype="multipart/form-data"><label>Файл</label><input type="file" name="data_file" accept=".csv,.xlsx,.xls,.json,.pdf,.png,.jpg,.jpeg,.webp" required><label>График</label><select name="chart_type"><option>bar</option><option>line</option><option>histogram</option><option>pie</option><option>scatter</option><option>box</option><option>heatmap</option></select><div class="two"><input name="x_column" placeholder="Колонка X (необязательно)"><input name="y_column" placeholder="Колонка Y (необязательно)"></div><button>Проанализировать</button></form></section><section class="card"><h2>Мои файлы</h2>{% for f in records %}<p>{{ f.original_name }} · {{ f.kind }} · {{ (f.size_bytes/1024)|round(1) }} КБ</p>{% else %}<p>Файлов пока нет.</p>{% endfor %}</section></main><script>const scheme=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${scheme}://${location.host}/ws/status`);ws.onmessage=e=>{const d=JSON.parse(e.data);document.querySelector('#ws-status').textContent='● '+d.message};ws.onopen=()=>ws.send('dashboard-ready');ws.onerror=()=>document.querySelector('#ws-status').textContent='Канал статуса недоступен';</script></body></html>
