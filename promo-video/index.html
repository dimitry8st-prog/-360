<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ДИС Аналитик 360 — промо</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0c2740;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #123b5d;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-01-hook"
        class="clip scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-02-upload"
        class="clip scene"
        data-composition-id="02-upload"
        data-composition-src="compositions/frames/02-upload.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-03-quality"
        class="clip scene"
        data-composition-id="03-quality"
        data-composition-src="compositions/frames/03-quality.html"
        data-start="14"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-04-chat"
        class="clip scene"
        data-composition-id="04-chat"
        data-composition-src="compositions/frames/04-chat.html"
        data-start="24"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-05-charts"
        class="clip scene"
        data-composition-id="05-charts"
        data-composition-src="compositions/frames/05-charts.html"
        data-start="34"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-06-realtime"
        class="clip scene"
        data-composition-id="06-realtime"
        data-composition-src="compositions/frames/06-realtime.html"
        data-start="44"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-07-finale"
        class="clip scene"
        data-composition-id="07-finale"
        data-composition-src="compositions/frames/07-finale.html"
        data-start="52"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-captions"
        class="clip scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="60"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
        data-layout-allow-caption-zone="true"
      ></div>
      <audio id="vo-1" src="assets/voice/01.wav" data-start="0" data-duration="5.736" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-2" src="assets/voice/02.wav" data-start="6" data-duration="4.392" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-3" src="assets/voice/03.wav" data-start="14" data-duration="6.888" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-4" src="assets/voice/04.wav" data-start="24" data-duration="5.016" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-5" src="assets/voice/05.wav" data-start="34" data-duration="5.016" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-6" src="assets/voice/06.wav" data-start="44" data-duration="5.352" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-7" src="assets/voice/07.wav" data-start="52" data-duration="6.336" data-track-index="10" data-volume="1"></audio>
      <audio id="el-bgm" src="assets/bgm/track.mp3" data-start="0" data-duration="60" data-track-index="11" data-volume="0.12"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#el-bgm", { volume: 0.12 }, { volume: 0.04, duration: 1.2, ease: "power1.in" }, 58.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
